# Builds LaihoE/demoparser (MIT) for the browser (WebAssembly), so the website can read .dem files itself.
# Output is committed: public/demoparser/ (website) and tools/demoparser-node/ (same build for Node, used to test).
# To update the parser: change PARSER_REV to a newer commit of https://github.com/LaihoE/demoparser and run this.
name: Build demo parser (browser)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/demoparser-wasm.yml']

permissions:
  contents: write

env:
  PARSER_REV: 45ca85aeac8fb0de9d385124d2c7fe0e7b8ff0c8

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: LaihoE/demoparser
          ref: ${{ env.PARSER_REV }}
          path: demoparser
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: demoparser/src/wasm
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Build (browser + Node)
        run: |
          wasm-pack build demoparser/src/wasm --release --target web    --out-dir "$GITHUB_WORKSPACE/public/demoparser"  --out-name demoparser2
          wasm-pack build demoparser/src/wasm --release --target nodejs --out-dir "$GITHUB_WORKSPACE/tools/demoparser-node" --out-name demoparser2
          for d in public/demoparser tools/demoparser-node; do
            rm -f "$d/.gitignore" "$d/README.md"
            echo "LaihoE/demoparser@${PARSER_REV} (MIT), built $(date -u +%F) by .github/workflows/demoparser-wasm.yml" > "$d/VERSION"
          done
          ls -la public/demoparser tools/demoparser-node
      - name: Commit the build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/demoparser tools/demoparser-node
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Build demo parser for the browser (LaihoE/demoparser@${PARSER_REV:0:7})"
          git push
