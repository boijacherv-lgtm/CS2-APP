# Publishes the website (tsakhstvo.xyz) to GitHub Pages on every push to main.
# The online build has no server: Tactical, Review/Match report of saved .json matches.
# Log in with Steam and the Steam match list come from the Cloudflare Worker (worker/) once API_URL is set.
# Reading .dem files stays in the desktop version (npm run dev).
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_ONLINE: '1'
          # the Cloudflare Worker's address (repo Settings → Secrets and variables → Actions → Variables → API_URL);
          # empty = Log in with Steam / Your matches stay hidden on the site
          VITE_API_URL: ${{ vars.API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
