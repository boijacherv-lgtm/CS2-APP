# The nightly coach check (Tier 2 of learning from disputes, the part that runs without training demos): grades every
# moment the owner has ruled on with the coach on main and reports the agreement to the dev page (Coach). Retraining
# needs the training demos, which live on the owner's PC (npm run learn:all). Also started from the dev page.
# Secret: SERVER_TOKEN (the Worker's shared secret, already set for the bots).
name: Coach check
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run coach:check
        env:
          STRATBOARD_SERVER_TOKEN: ${{ secrets.SERVER_TOKEN }}
