# Fly.io app for the Deadlock bot service (server/src/deadlock.mjs). Setup and deploy: server/DEADLOCK.md.
app = "rageview-dl-bot"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile.deadlock"

[env]
  DATA_DIR = "/data"
  PORT = "8080"
  DL_POLL_MINUTES = "5"
  DL_ALLOW_ORIGINS = "https://tsakhstvo.xyz,http://localhost:5173"

# the bot's renewed login and what it has seen, kept across restarts
[mounts]
  source = "dl_bot_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # always on: the bot has to stay logged in to Steam
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
